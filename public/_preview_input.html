<!DOCTYPE html>
<html lang="ko">


<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<style>
  :root {
    --base: #08100e;
    --green: #35e0a6;      /* 틴트그린 강조 (흑묘 톤) */
    --green-dim: rgba(53,224,166,0.16);
    --gold: #e8c877;
    --ink: rgba(255,255,255,0.94);
    --ink-dim: rgba(255,255,255,0.62);
    --line: rgba(255,255,255,0.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--base);
    font-family: 'Pretendard', system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
  }

  /* ===== 배경 캐릭터 이미지 (스텝별 크로스페이드) ===== */
  .bg-layer {
    position: fixed; inset: 0; z-index: 0;
    background-size: cover; background-position: center top;
    background-repeat: no-repeat;
    transition: opacity 600ms ease;
  }
  .bg-1 { background-image: url('/assets/images/tight/romantic/intro/input/input1.jpg'); opacity: 1; }
  .bg-2 { background-image: url('/assets/images/tight/romantic/intro/input/input2.jpg'); opacity: 0; }
  body.personal .bg-1 { opacity: 0; }
  body.personal .bg-2 { opacity: 1; }

  /* ===== 가독성용 스크림 (위: 캐릭터 노출 / 아래: 어둡게) ===== */
  .scrim {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to bottom,
      rgba(8,16,14,0.10) 0%,
      rgba(8,16,14,0.0)  30%,
      rgba(8,16,14,0.28) 52%,
      rgba(8,16,14,0.74) 70%,
      rgba(8,16,14,0.95) 86%,
      var(--base) 100%);
  }

  /* ===== 하단 시트(질문 영역) ===== */
  .saju-wrapper {
    position: relative; z-index: 3;
    min-height: 100vh;
    display: flex; flex-direction: column; justify-content: flex-end;
  }

  .question-box {
    position: relative; z-index: 1;
    width: 100%; max-width: 520px; margin: 0 auto;
    padding: 26px 24px calc(30px + env(safe-area-inset-bottom, 0px));
  }

  .back-btn {
    position: fixed; top: 16px; left: 16px; z-index: 5;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px; padding: 8px 14px;
    font-size: 14px; color: rgba(255,255,255,0.82); cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .back-btn:hover { color: #fff; }

  /* 히스토리(이전 답변 로그) */
  .history { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .history-item {
    padding: 12px 14px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(0,0,0,0.30);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .history-item.dim { opacity: 0.5; }
  .history-q { font-size: 12px; color: rgba(255,255,255,0.62); margin: 0 0 6px; }
  .history-a { font-size: 15px; color: rgba(255,255,255,0.92); margin: 0; }
  .history-a b { font-weight: 700; color: var(--green); }

  /* 나레이션(흑묘 목소리) */
  .narration {
    display: none;
    font-size: 15px; color: rgba(120,240,190,0.82);
    letter-spacing: -0.01em; margin: 0 0 6px;
  }

  .q-title { font-size: 23px; font-weight: 700; color: #fff; line-height: 1.38; letter-spacing: -0.02em; }
  .q-desc  { margin-top: 8px; font-size: 14px; color: var(--ink-dim); }

  .answer-area { margin-top: 22px; }

  /* 텍스트/셀렉트 입력 */
  .answer-area input[type="text"] {
    width: 100%; text-align: center;
    background: rgba(0,0,0,0.42);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 14px; padding: 15px 14px;
    font-size: 18px; color: #fff; outline: none;
    transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
  }
  .answer-area input[type="text"]:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 5px var(--green-dim);
    background: rgba(0,0,0,0.5);
  }
  .answer-area input::placeholder { color: rgba(255,255,255,0.42); }

  .answer-area select {
    width: 100%; padding: 15px 12px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(0,0,0,0.42); font-size: 16px; color: #fff; outline: none;
  }
  .answer-area select:focus { border-color: var(--green); box-shadow: 0 0 0 5px var(--green-dim); }

  /* 성별 등 2지선다 버튼 */
  .select-row { display: flex; gap: 12px; }
  .select-btn {
    flex: 1; padding: 15px 0; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(0,0,0,0.42); font-size: 16px; color: rgba(255,255,255,0.88);
    transition: transform 140ms ease, border-color 160ms ease, background 160ms ease;
  }
  .select-btn.active {
    background: var(--green-dim); color: #fff;
    border-color: rgba(53,224,166,0.72);
    box-shadow: 0 0 0 4px rgba(53,224,166,0.12);
  }
  .select-btn:active { transform: scale(0.99); }

  /* 개별질문 라디오 옵션 */
  .opt-list { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 15px 16px; border-radius: 14px; text-align: left;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(0,0,0,0.38); color: rgba(255,255,255,0.90);
    font-size: 16px; letter-spacing: -0.01em;
    transition: border-color 150ms ease, background 150ms ease, transform 120ms ease;
  }
  .opt .dot {
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4); transition: all 150ms ease;
  }
  .opt.active { border-color: var(--green); background: var(--green-dim); color: #fff; }
  .opt.active .dot {
    border-color: var(--green);
    background: radial-gradient(circle, var(--green) 0 42%, transparent 46%);
    box-shadow: 0 0 10px rgba(53,224,166,0.5);
  }
  .opt:active { transform: scale(0.995); }

  /* 다음 버튼 */
  .next-btn {
    margin-top: 26px; width: 100%; padding: 17px 0;
    border-radius: 999px; border: none;
    background: #ffffff; color: #0d1512;
    font-size: 16px; font-weight: 700; letter-spacing: -0.2px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.45);
    transition: transform 150ms ease, filter 160ms ease;
  }
  .next-btn:hover { filter: brightness(0.97); }
  .next-btn:active { transform: translateY(1px); }

  @media (min-width: 768px) {
    .saju-wrapper { justify-content: flex-end; }
    .question-box { padding-bottom: 40px; }
  }

  /* ===== LOADING OVERLAY (심플·프리미엄) ===== */
  #loadingOverlay {
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: radial-gradient(60% 48% at 50% 42%, rgba(18,42,33,0.6) 0%, #060b09 74%);
    flex-direction: column; align-items: center; justify-content: center;
    gap: 30px; animation: overlayIn 500ms ease both;
  }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

  .ldr { position: relative; width: 66px; height: 66px; }
  /* 얇은 골드-그린 그라데이션 링 */
  .ldr-ring {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 90deg,
      rgba(53,224,166,0) 0%, rgba(53,224,166,0.9) 48%, #e8c877 80%, rgba(232,200,119,0) 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2.5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2.5px));
    filter: drop-shadow(0 0 6px rgba(53,224,166,0.45));
    animation: spin 1.1s linear infinite;
  }
  /* 중앙에 깜빡이는 고양이 눈(세로 슬릿) */
  .ldr-eye {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 8px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle, #c9ffe9 0%, #35e0a6 52%, rgba(53,224,166,0) 78%);
    box-shadow: 0 0 14px rgba(53,224,166,0.7);
    animation: eyeblink 3.2s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes eyeblink {
    0%, 90%, 100% { transform: translate(-50%,-50%) scaleY(1); }
    95%           { transform: translate(-50%,-50%) scaleY(0.12); }
  }

  .ldr-text { text-align: center; }
  .ldr-title {
    font-family: 'Pretendard', system-ui, sans-serif;
    font-size: 16px; font-weight: 600; letter-spacing: 0.01em;
    color: rgba(255,255,255,0.92); margin: 0 0 8px;
    animation: breathe 2.6s ease-in-out infinite;
  }
  .ldr-sub {
    font-family: 'Pretendard', system-ui, sans-serif;
    font-size: 13px; letter-spacing: 0.02em;
    color: rgba(190,240,218,0.5); margin: 0;
  }
  @keyframes breathe { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
</style>

<body>

<div class="bg-layer bg-1" aria-hidden="true"></div>
<div class="bg-layer bg-2" aria-hidden="true"></div>
<div class="scrim" aria-hidden="true"></div>

<div id="loadingOverlay">
  <div class="ldr">
    <div class="ldr-ring"></div>
    <div class="ldr-eye"></div>
  </div>
  <div class="ldr-text">
    <p class="ldr-title">흑묘가 그대의 사주를 들여다보는 중</p>
    <p class="ldr-sub">잠시만, 곧 모든 게 보일 거야</p>
  </div>
</div>

<button type="button" class="back-btn" id="backBtn">← 뒤로가기</button>

<div class="saju-wrapper">
  <form id="sajuForm" method="POST" action="/saju/romantic/result" class="question-box">
    <!-- 🔒 기존 hidden 유지 -->
    <input type="hidden" name="gender" id="genderInput">
    <input type="hidden" name="birthType" id="birthTypeInput" value="양력">
    <input type="hidden" name="name">
    <input type="hidden" name="birthdate" id="birthDateInput">
    <input type="hidden" name="birthTime" id="birthTimeInput" value="unknown">
    <!-- 개별질문 답변 -->
    <input type="hidden" name="love_status" id="loveStatusInput">
    <input type="hidden" name="love_want"   id="loveWantInput">
    <input type="hidden" name="love_regret" id="loveRegretInput">

    <div class="history" id="history"></div>

    <div class="question-text">
      <div class="narration" id="narration"></div>
      <div class="q-title"></div>
      <div class="q-desc"></div>
    </div>

    <div class="answer-area"></div>

    <button type="button" class="next-btn" id="nextBtn">다음으로</button>
  </form>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const ticketCode = urlParams.get('ticket');

function escapeHtmlAttr(str) {
  return String(str)
    .replaceAll("&", "&amp;").replaceAll('"', "&quot;")
    .replaceAll("<", "&lt;").replaceAll(">", "&gt;");
}

/* 개별질문 라디오 옵션 HTML */
function optListHtml(options, cur) {
  return '<div class="opt-list">' + options.map(o =>
    `<button type="button" class="opt${o === cur ? ' active' : ''}" data-value="${escapeHtmlAttr(o)}">
       <span class="dot"></span><span class="opt-text">${escapeHtmlAttr(o)}</span>
     </button>`
  ).join('') + '</div>';
}

const BIRTH_TIME_OPTIONS = [
  ["unknown","모름"],["00","조자 (00:00~01:29)"],["02","축 (01:30~03:29)"],["04","인 (03:30~05:29)"],
  ["06","묘 (05:30~07:29)"],["08","진 (07:30~09:29)"],["10","사 (09:30~11:29)"],["12","오 (11:30~13:29)"],
  ["14","미 (13:30~15:29)"],["16","신 (15:30~17:29)"],["18","유 (17:30~19:29)"],["20","술 (19:30~21:29)"],
  ["22","해 (21:30~23:29)"],["24","야자 (23:30~23:59)"]
];

const steps = [
  {
    key: "name", title: "먼저, 어떻게 불러줄까?", desc: "편하게 사용할 이름이면 돼.",
    render: () => {
      const current = document.querySelector('input[name="name"]')?.value || "";
      return `<input type="text" placeholder="이름을 입력해주세요" value="${escapeHtmlAttr(current)}">`;
    },
    validate: () => {
      const v = document.querySelector('.answer-area input').value.trim();
      if (!v) return false;
      document.querySelector('input[name="name"]').value = v;
      return true;
    },
    display: () => document.querySelector('input[name="name"]').value?.trim() || "",
  },
  {
    key: "gender", title: "성별을 알려줘", desc: "성별에 따라 해석 기준이 달라져.",
    render: () => `
      <div class="select-row">
        <button type="button" class="select-btn" data-value="남성">남성</button>
        <button type="button" class="select-btn" data-value="여성">여성</button>
      </div>`,
    validate: () => !!document.getElementById('genderInput').value,
    display: () => document.getElementById('genderInput').value || "",
  },
  {
    key: "birthdate", title: "태어난 날을 알려줘", desc: "YYYYMMDD 형식으로 입력해줘.",
    render: () => {
      const hidden = document.getElementById('birthDateInput')?.value || "";
      const v = hidden ? String(hidden).replaceAll("-", "") : "";
      return `<input type="text" maxlength="8" placeholder="예) 19940517" value="${escapeHtmlAttr(v)}">`;
    },
    validate: () => {
      const v = document.querySelector('.answer-area input').value.trim();
      if (!v || !/^\d{8}$/.test(v)) return false;
      document.getElementById('birthDateInput').value = `${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`;
      return true;
    },
    display: () => {
      const hidden = document.getElementById('birthDateInput')?.value || "";
      return hidden ? hidden.replaceAll("-", ".") : "";
    },
  },
  {
    key: "birthTime", title: "태어난 시를 알고 있어?", desc: "몰라도 괜찮아.",
    render: () => {
      const cur = document.getElementById('birthTimeInput').value || "unknown";
      const opts = BIRTH_TIME_OPTIONS.map(([val,label]) =>
        `<option value="${val}"${val === cur ? " selected" : ""}>${label}</option>`).join("");
      return `<select id="birthTimeSelect">${opts}</select>`;
    },
    validate: () => {
      const sel = document.getElementById('birthTimeSelect');
      if (sel) document.getElementById('birthTimeInput').value = sel.value;
      return true;
    },
    display: () => {
      const sel = document.getElementById('birthTimeSelect');
      if (sel) return sel.options[sel.selectedIndex].textContent.trim();
      const found = BIRTH_TIME_OPTIONS.find(o => o[0] === document.getElementById('birthTimeInput').value);
      return found ? found[1] : "";
    },
  },

  /* ===== 개별질문 (배경 input2) ===== */
  {
    key: "love_status", type: "personal", field: "loveStatusInput",
    narration: "…솔직하게 말해봐.", title: "지금 마음에 둔 사람 있어?",
    options: ["없어, 그냥 혼자가 편해", "있는데 애매한 썸이야", "지금 사귀는 사람 있어", "재회하고 싶은 옛사람 🖤"],
    render() { return optListHtml(this.options, document.getElementById(this.field).value); },
    validate() { return !!document.getElementById(this.field).value; },
    display() { return document.getElementById(this.field).value || ""; },
  },
  {
    key: "love_want", type: "personal", field: "loveWantInput",
    narration: "탐욕스럽네, 마음에 들어.", title: "연애에서 진짜 원하는 건?",
    options: ["나만 바라보는 헌신적인 사람", "나를 설레게 하는 강한 끌림", "안정적이고 편안한 관계", "내가 쥐고 흔드는 관계 😼"],
    render() { return optListHtml(this.options, document.getElementById(this.field).value); },
    validate() { return !!document.getElementById(this.field).value; },
    display() { return document.getElementById(this.field).value || ""; },
  },
  {
    key: "love_regret", type: "personal", field: "loveRegretInput",
    narration: "아직 거기 묶여있구나.", title: "놓지 못한 사람이 있어?",
    options: ["완전히 정리했어", "가끔 생각나긴 해", "아직 마음 한켠에 있어", "돌아갈 수만 있다면 🥀"],
    render() { return optListHtml(this.options, document.getElementById(this.field).value); },
    validate() { return !!document.getElementById(this.field).value; },
    display() { return document.getElementById(this.field).value || ""; },
  },
];

let stepIndex = 0;
const qTitle = document.querySelector('.q-title');
const qDesc = document.querySelector('.q-desc');
const narrationEl = document.getElementById('narration');
const answerArea = document.querySelector('.answer-area');
const historyEl = document.getElementById('history');
const nextBtn = document.getElementById('nextBtn');
const backBtn = document.getElementById('backBtn');

/* 현재 스텝 기준으로 히스토리를 다시 그림.
   - 기본질문 구간: 이전에 답한 기본질문들이 위에 쌓임(스크롤업 효과)
   - 개별질문 구간: 히스토리 없음 → 진입 시 위 질문들이 사라지고 깔끔하게 표시 */
function rebuildHistory() {
  historyEl.innerHTML = '';
  if (steps[stepIndex].type === 'personal') return;   // 개별질문은 히스토리 미표시
  for (let i = 0; i < stepIndex; i++) {
    if (steps[i].type === 'personal') continue;
    const ans = steps[i].display ? steps[i].display() : "";
    if (!ans) continue;
    const item = document.createElement('div');
    item.className = 'history-item' + (i < stepIndex - 1 ? ' dim' : '');
    item.innerHTML = `<p class="history-q">${escapeHtmlAttr(steps[i].title)}</p><p class="history-a"><b>${escapeHtmlAttr(ans)}</b></p>`;
    historyEl.appendChild(item);
  }
}

function renderStep() {
  const step = steps[stepIndex];
  const isPersonal = step.type === 'personal';

  document.body.classList.toggle('personal', isPersonal);
  narrationEl.textContent = isPersonal ? (step.narration || '') : '';
  narrationEl.style.display = isPersonal ? 'block' : 'none';

  qTitle.textContent = step.title;
  qDesc.textContent = step.desc || '';
  answerArea.innerHTML = step.render();
  backBtn.style.display = stepIndex === 0 ? 'none' : 'block';
  rebuildHistory();

  // 2지선다(성별) 바인딩
  answerArea.querySelectorAll('.select-btn').forEach(btn => {
    btn.onclick = () => {
      answerArea.querySelectorAll('.select-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('genderInput').value = btn.dataset.value;
    };
  });
  if (step.key === "gender") {
    const current = document.getElementById('genderInput').value;
    if (current) answerArea.querySelectorAll('.select-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.value === current);
    });
  }

  // 개별질문 라디오 바인딩
  if (isPersonal) {
    answerArea.querySelectorAll('.opt').forEach(btn => {
      btn.onclick = () => {
        answerArea.querySelectorAll('.opt').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(step.field).value = btn.dataset.value;
      };
    });
  }

  nextBtn.textContent = stepIndex === steps.length - 1 ? '결과 보기' : '다음으로';
}

nextBtn.onclick = () => {
  if (!steps[stepIndex].validate()) {
    alert('값을 입력해주세요.');
    return;
  }

  if (stepIndex < steps.length - 1) {
    stepIndex++;
    renderStep();
  } else {
    const form = document.getElementById('sajuForm');
    const nameValue = document.querySelector('input[name="name"]').value;
    $(form).find('input[name="goodsType"]').remove();
    $('<input>').attr({type: 'hidden', name: 'goodsType', value: '1'}).appendTo(form);

    if (nameValue === "관리자" || nameValue === "테스트") {
      form.action = "/saju/skip-payment";
      alert('(미리보기) 관리자 스킵'); return;
    }

    if (ticketCode) {
      $(form).find('input[name="ticket"]').remove();
      $('<input>').attr({type: 'hidden', name: 'ticket', value: ticketCode}).appendTo(form);
      form.action = `/saju/romantic/result?ticket=${ticketCode}`;
    }

    document.getElementById('loadingOverlay').style.display = 'flex';
    setTimeout(() => { alert('(미리보기) 제출! 실제 앱에선 결과로 이동'); document.getElementById('loadingOverlay').style.display='none'; }, 3000);
  }
};

backBtn.onclick = () => {
  if (stepIndex > 0) {
    stepIndex--;
    renderStep();
  }
};

renderStep();
if(location.hash==='#loader'){document.getElementById('loadingOverlay').style.display='flex';}
</script>
