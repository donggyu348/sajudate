<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>흑묘 사주 intro preview</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Poor+Story&display=swap" rel="stylesheet">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  html, body { margin:0; padding:0; background:#0f0c12; height:100%; width:100%; overflow:hidden; }
  .frame-wrap { display:flex; justify-content:center; background:#0f0c12; height:100%; }
  .video-stage { position:relative; width:100%; max-width:448px; height:100vh; overflow:hidden; }
  .bg-stage { position:absolute; inset:0;
    background-image:url('/assets/images/tight/romantic/intro/intro.jpg');
    background-size:cover; background-position:center top; background-repeat:no-repeat; }
  .bottom-fade { position:absolute; bottom:0; left:0; right:0; height:220px; z-index:5;
    background:linear-gradient(to top, rgba(8,5,14,0.88) 0%, rgba(8,5,14,0) 100%); }

  .fx { position:absolute; inset:0; z-index:4; pointer-events:none; }
  .title-glow { position:absolute; left:50%; top:11%; transform:translate(-50%,-50%);
    width:76%; height:120px; border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(96,255,176,0.30) 0%, rgba(96,255,176,0) 70%);
    filter:blur(6px); mix-blend-mode:screen; animation:titleBreath 3.6s ease-in-out infinite; }
  @keyframes titleBreath { 0%,100%{opacity:.40;transform:translate(-50%,-50%) scale(.97);} 50%{opacity:.90;transform:translate(-50%,-50%) scale(1.05);} }

  .eye-glow { position:absolute; width:26px; height:26px; transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle, rgba(150,255,190,0.95) 0%, rgba(90,240,150,0.5) 38%, rgba(70,220,130,0) 72%);
    mix-blend-mode:screen; animation:eyePulse 2.8s ease-in-out infinite; }
  .eye-glow.e-l{left:17%;top:48%;} .eye-glow.e-r1{left:88%;top:44%;animation-duration:3.5s;animation-delay:.6s;}
  .eye-glow.e-r2{left:88%;top:50%;animation-duration:2.2s;animation-delay:1.1s;}
  @keyframes eyePulse { 0%,100%{opacity:.30;transform:translate(-50%,-50%) scale(.80);} 45%{opacity:1;transform:translate(-50%,-50%) scale(1.15);} }

  .floaties { position:absolute; inset:0; z-index:6; pointer-events:none; }
  .cap { position:absolute; display:inline-flex; align-items:center; gap:6px; padding:9px 13px; border-radius:999px;
    white-space:nowrap; font-family:'Pretendard',system-ui,-apple-system,"Segoe UI",sans-serif; font-size:13px; font-weight:600; letter-spacing:-0.02em; color:#eafff2;
    background:rgba(10,20,16,0.55); border:1px solid rgba(120,255,180,0.40);
    box-shadow:0 8px 24px rgba(0,0,0,0.45), 0 0 16px rgba(80,240,150,0.18);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    opacity:0; animation:capIn .7s ease both, capFloat 5s ease-in-out infinite; }
  .cap.c1{left:6%;top:29%;animation-delay:.3s,.9s;} .cap.c2{right:6%;top:39%;animation-delay:.6s,1.4s;} .cap.c3{left:9%;top:57%;animation-delay:.9s,.5s;}
  @keyframes capIn { from{opacity:0;} to{opacity:1;} }
  @keyframes capFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);} }

  .cta-wrap { position:absolute; bottom:32px; left:50%; transform:translateX(-50%); width:calc(100% - 48px); max-width:400px; z-index:10; }
  .cta-btn { display:flex; align-items:center; justify-content:center; width:100%; padding:20px 24px; border-radius:999px;
    text-decoration:none; font-family:'Jua',system-ui,sans-serif; font-size:19px; letter-spacing:-0.02em; color:#fff; background:#e8366e;
    animation:ctaBreath 2.4s ease-in-out infinite; }
  @keyframes ctaBreath { 0%,100%{box-shadow:0 8px 28px rgba(232,54,110,.45),0 2px 8px rgba(0,0,0,.3);} 50%{box-shadow:0 10px 40px rgba(232,54,110,.80),0 0 22px rgba(232,54,110,.5);} }
</style>
</head>
<body>
  <div class="frame-wrap">
    <div class="video-stage">
      <div class="bg-stage"></div>
      <div class="fx">
        <span class="title-glow"></span>
        <span class="eye-glow e-l"></span><span class="eye-glow e-r1"></span><span class="eye-glow e-r2"></span>
      </div>
      <div class="bottom-fade"></div>
      <div class="floaties">
        <span class="cap c1">🖤 나를 거부 못하는 이성</span>
        <span class="cap c2">😼 치명적 매력 지수</span>
        <span class="cap c3">🥀 무릎 꿇을 상대</span>
      </div>
      <div class="cta-wrap"><a href="#" class="cta-btn">무료로 나의 연애운 미리보기</a></div>
    </div>
  </div>
</body>
</html>
