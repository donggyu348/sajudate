<head>
  <style>
    :root {
      --red: #c0392b;
      --gold: #c9a84c;
      --white-dim: rgba(255,255,255,0.35);
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      overflow: hidden;
    }

    .stage {
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      position: relative;
      background: linear-gradient(180deg, #0a0000 0%, #070000 50%, #030000 100%);
      overflow: hidden;
    }

    html, body { background: #000 !important; }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%);
    }

    /* 진행바 */
    .progress-bar {
      position: absolute;
      top: 0; left: 0;
      height: 3px;
      background: var(--red);
      transition: width 0.4s ease;
      z-index: 20;
    }

    /* ===== 누적형(스택) 개인정보 ===== */
    .stack-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 48px 24px calc(40px + env(safe-area-inset-bottom));
      box-sizing: border-box;
      overflow-y: auto;
      z-index: 6;
      transition: opacity 0.25s ease;
    }
    .stack-wrap.hidden { display: none; }
    .stack-wrap.fading { opacity: 0; }
    .stack-wrap::-webkit-scrollbar { display: none; }

    .stack-heading { text-align: left; }
    .stack-sub {
      font-size: 11px; letter-spacing: 0.22em;
      color: var(--gold); opacity: 0.85; margin: 0 0 10px;
    }
    .stack-who { font-family: 'Noto Serif KR', serif; font-size: 22px; font-weight: 700; margin: 0; color: #fff; letter-spacing: 0.01em; }

    /* 새 질문이 위, 답한 항목은 아래로 (column-reverse) */
    .stack-list { display: flex; flex-direction: column-reverse; gap: 24px; margin-top: 26px; }

    .field { animation: fieldIn 0.4s ease; }
    @keyframes fieldIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: none; }
    }
    .field .q { margin-bottom: 16px; }
    .field:not(.on) .q { display: none; }  /* 답한 항목은 제목 숨김 */
    .field:not(.on) { opacity: 0.92; }

    .q-cap { font-size: 12.5px; color: rgba(201,168,76,0.8); letter-spacing: 0.02em; margin: 0 0 10px; }
    .q-title { font-family: 'Noto Serif KR', serif; font-size: 25px; font-weight: 700; margin: 0; color: #fff; line-height: 1.4; white-space: pre-line; }

    .ctrl.row { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(201,168,76,0.28); padding-bottom: 10px; }
    .ctrl.row .line-input,
    .ctrl.row .time-inputs { flex: 1 1 auto; min-width: 0; }

    .line-input {
      background: transparent; border: none; outline: none;
      color: #f4ede5; font-size: 22px; font-weight: 600; letter-spacing: 0.02em;
      width: 100%; padding: 4px 2px;
    }
    .line-input::placeholder { color: rgba(244,237,229,0.28); }

    .time-inputs { display: flex; align-items: center; gap: 6px; }
    .time-inputs .line-input { width: 46px; text-align: center; }
    .time-inputs .colon { font-size: 22px; color: rgba(244,237,229,0.6); }

    /* 알약 버튼 */
    .pill {
      border: 1px solid rgba(201,168,76,0.35);
      background: rgba(255,255,255,0.03); color: rgba(244,237,229,0.7);
      border-radius: 24px; padding: 11px 20px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      white-space: nowrap; transition: all 0.2s ease;
    }
    .pill.selected, .pill.confirm {
      background: linear-gradient(135deg, #8b1a1a, #c0392b);
      color: #fff7ea; border-color: rgba(224,184,102,0.7);
      box-shadow: 0 0 14px rgba(192,57,43,0.4);
    }
    .pill-group { display: flex; gap: 8px; flex: 0 0 auto; }

    .gender-ctrl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .gender-ctrl .pill.big {
      padding: 16px 0; border-radius: 30px; font-size: 16px; text-align: center;
    }

    /* ===== 질문(스텝형: 이별 관련/카드) ===== */
    .question-layer {
      position: absolute;
      top: 36%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      padding: 0 24px;
      text-align: center;
      z-index: 5;
      transition: all 0.4s ease;
    }
    .question-layer.card-mode { top: 13%; }
    .question-layer.choice-mode { top: 15%; }
    .question-sub { font-size: 11px; letter-spacing: 0.22em; color: var(--gold); opacity: 0.75; margin-bottom: 10px; }
    .question-title { font-family: 'Noto Serif KR', serif; font-size: 24px; font-weight: 700; line-height: 1.5; letter-spacing: 0; white-space: pre-line; }

    .step { display: none; }
    .step.shown { display: block; }

    .input-area {
      position: absolute;
      top: 54%;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 48px);
      max-width: 420px;
      z-index: 5;
      animation: fadeUp 0.45s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translate(-50%, 14px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    .input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--white-dim);
      padding: 10px 6px;
      font-size: 20px;
      color: #fff;
      outline: none;
      text-align: center;
      letter-spacing: 0.02em;
      transition: border-color 0.3s ease;
      box-sizing: border-box;
    }
    .input::placeholder { color: rgba(255,255,255,0.3); }
    .input:focus { border-bottom-color: var(--red); }

    .input-area.choice-area { top: 28%; bottom: 96px; height: auto; overflow-y: auto; }
    .input-area.choice-area::-webkit-scrollbar { display: none; }
    .choice-btn {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      color: rgba(255,255,255,0.85);
      font-size: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .choice-btn.sel {
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 0 14px rgba(201,168,76,0.25);
      font-weight: 700;
    }

    /* 다음 버튼 */
    .next-btn {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 48px);
      max-width: 420px;
      height: 52px;
      border-radius: 26px;
      border: 1px solid var(--red);
      background: transparent;
      color: var(--red);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.12em;
      z-index: 10;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .next-btn:hover { background: var(--red); color: #fff; }

    /* ===== 카드 선택 스텝 ===== */
    .card-step {
      display: none;
      position: absolute;
      top: 22%;
      left: 0; right: 0;
      bottom: 90px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 14px 20px;
      z-index: 5;
      background: transparent;
      animation: fadeUp2 0.45s ease;
      outline: none !important;
      border: none !important;
      box-shadow: none !important;
    }
    .card-step::-webkit-scrollbar { display: none; }
    .card-step.shown { display: block; }
    @keyframes fadeUp2 {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .card-item { position: relative; cursor: pointer; transition: box-shadow 0.25s ease, opacity 0.25s ease; }
    .card-item img { width: 100%; display: block; }
    .card-item.selected { box-shadow: 0 0 24px rgba(201,168,76,0.6); opacity: 1; }
    .card-item:not(.selected) { opacity: 0.85; }

    @keyframes floatA { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes floatB { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes floatC { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .float-a { animation: floatA 3.2s ease-in-out infinite; }
    .float-b { animation: floatB 3.8s ease-in-out infinite 0.6s; }
    .float-c { animation: floatC 4.1s ease-in-out infinite 1.2s; }
    .float-d { animation: floatA 3.5s ease-in-out infinite 0.3s; }
    .float-e { animation: floatB 4.3s ease-in-out infinite 0.9s; }
    .float-f { animation: floatC 3.7s ease-in-out infinite 1.5s; }

    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0px 1000px rgba(10,0,0,0.8) inset;
      -webkit-text-fill-color: #fff;
    }
  </style>
</head>

<body>
<div class="stage">

  <div class="progress-bar" id="progressBar" style="width:6%"></div>

  <!-- ===== 누적형: 개인정보 (나 → 상대방) ===== -->
  <div class="stack-wrap" id="stackWrap">
    <div class="stack-heading">
      <p class="stack-sub">재회 사주</p>
      <h1 class="stack-who" id="stackWho">나의 정보를 알려주세요</h1>
    </div>
    <div class="stack-list" id="stackList"></div>
  </div>

  <!-- ===== 스텝형: 이별 관련 + 카드 ===== -->
  <div class="question-layer" id="questionLayer" style="display:none;">
    <p class="question-sub">재회 사주</p>
    <h1 id="questionTitle" class="question-title"></h1>
  </div>

  <form id="sajuForm" method="POST" action="/saju/reunion/loading">
    <!-- 개인정보(누적형에서 채움) -->
    <input type="hidden" name="name"              id="f_name">
    <input type="hidden" name="gender"            id="f_gender">
    <input type="hidden" name="birthdate"         id="f_birthdate">
    <input type="hidden" name="birthType"         id="f_birthType">
    <input type="hidden" name="birthTime"         id="f_birthTime">
    <input type="hidden" name="partnerName"       id="f_partnerName">
    <input type="hidden" name="partnerGender"     id="f_partnerGender">
    <input type="hidden" name="partnerBirthdate"  id="f_partnerBirthdate">
    <input type="hidden" name="partnerBirthType"  id="f_partnerBirthType">
    <input type="hidden" name="partnerBirthTime"  id="f_partnerBirthTime">
    <!-- 스텝형 선택값 -->
    <input type="hidden" name="relationStatus"    id="relationStatusInput">
    <input type="hidden" name="breakupReason"     id="breakupReasonInput">
    <input type="hidden" name="breakupInitiator"  id="breakupInitiatorInput">

    <!-- STEP: 멀어진 이유 -->
    <section class="step">
      <div class="input-area choice-area">
        <button type="button" class="choice-btn" data-value="성격 차이와 잦은 다툼" onclick="selectChoice(this,'breakupReasonInput')">성격 차이와 잦은 다툼</button>
        <button type="button" class="choice-btn" data-value="집착 및 이성 문제" onclick="selectChoice(this,'breakupReasonInput')">집착 및 이성 문제</button>
        <button type="button" class="choice-btn" data-value="상대방의 잠수이별 및 통보" onclick="selectChoice(this,'breakupReasonInput')">상대방의 잠수이별 및 통보</button>
        <button type="button" class="choice-btn" data-value="상대방의 바람 및 외도" onclick="selectChoice(this,'breakupReasonInput')">상대방의 바람 및 외도</button>
      </div>
    </section>

    <!-- STEP: 이별 통보자 -->
    <section class="step">
      <div class="input-area choice-area">
        <button type="button" class="choice-btn" data-value="내가 먼저" onclick="selectChoice(this,'breakupInitiatorInput')">내가 먼저</button>
        <button type="button" class="choice-btn" data-value="상대방이 먼저" onclick="selectChoice(this,'breakupInitiatorInput')">상대방이 먼저</button>
        <button type="button" class="choice-btn" data-value="서로 자연스럽게" onclick="selectChoice(this,'breakupInitiatorInput')">서로 자연스럽게</button>
      </div>
    </section>

    <!-- STEP: 이별 시기 -->
    <section class="step">
      <div class="input-area">
        <input name="breakupDate" class="input" placeholder="YYYYMMDD" maxlength="8" inputmode="numeric">
      </div>
    </section>

    <button type="button" id="nextBtn" class="next-btn" style="display:none;">다음으로</button>
  </form>

  <!-- 카드 선택 (form 바깥) -->
  <div class="card-step" id="cardStep" tabindex="-1">
    <div class="card-grid">
      <div class="card-item float-a" data-value="붉은 실" onclick="selectCard(this)">
        <img src="/assets/images/tight/reunion/cards/card1.png" alt="붉은 실">
      </div>
      <div class="card-item float-b" data-value="닫힌 문" onclick="selectCard(this)">
        <img src="/assets/images/tight/reunion/cards/card2.png" alt="닫힌 문">
      </div>
      <div class="card-item float-c" data-value="꺼진 등불" onclick="selectCard(this)">
        <img src="/assets/images/tight/reunion/cards/card3.png" alt="꺼진 등불">
      </div>
      <div class="card-item float-d" data-value="깨진 거울" onclick="selectCard(this)">
        <img src="/assets/images/tight/reunion/cards/card4.png" alt="깨진 거울">
      </div>
      <div class="card-item float-e" data-value="돌아오지 않은 편지" onclick="selectCard(this)">
        <img src="/assets/images/tight/reunion/cards/card5.png" alt="돌아오지 않은 편지">
      </div>
      <div class="card-item float-f" data-value="흐르는 강" onclick="selectCard(this)">
        <img src="/assets/images/tight/reunion/cards/card6.png" alt="흐르는 강">
      </div>
    </div>
  </div>

  <button type="button" id="cardNextBtn" class="next-btn" style="display:none;" onclick="submitForm()">
    나의 재회운 보기
  </button>

</div>

<script>
  /* ================= 누적형 개인정보 ================= */
  const TOTAL = 12; // 개인정보 8 + 이별관련 3 + 카드 1
  const progressBar = document.getElementById("progressBar");
  const stackWrap = document.getElementById("stackWrap");
  const stackList = document.getElementById("stackList");
  const stackWho  = document.getElementById("stackWho");

  const PERSONS = [
    { key: "me",  who: "나의 정보를 알려주세요",  possessive: "당신의" },
    { key: "you", who: "상대방 정보를 알려주세요", possessive: "상대방의" },
  ];
  const FIELDS = [
    { id: "gender", cap: "성별에 따라 대운의 시기가 달라져요", title: () => "성별을 알려주세요" },
    { id: "birth",  cap: "생년월일에 따라 사주팔자가 달라져요", title: (w) => w + " 생일을 알려주세요" },
    { id: "time",   cap: "태어난 시간에 따라 시주가 달라져요", title: () => "태어난 시간을 알려주세요" },
    { id: "name",   cap: "사주를 봐드리기 위해 필요해요", title: () => "이름을 입력해주세요" },
  ];

  const store = { me: {}, you: {} };
  let pIdx = 0, fIdx = 0;

  function shake(el) {
    el.animate(
      [{ transform:"translateX(0)" },{ transform:"translateX(-6px)" },{ transform:"translateX(6px)" },{ transform:"translateX(0)" }],
      { duration: 300 }
    );
  }
  function validDate(d) {
    if (!/^\d{8}$/.test(d)) return false;
    const y = +d.slice(0,4), m = +d.slice(4,6), day = +d.slice(6,8);
    return y >= 1900 && y <= 2100 && m >= 1 && m <= 12 && day >= 1 && day <= 31;
  }
  function setProgress() {
    const done = stackWrap.classList.contains("hidden") ? (8 + sIdx) : (pIdx * 4 + fIdx);
    progressBar.style.width = Math.min(((done + 1) / TOTAL) * 100, 100) + "%";
  }

  function buildField(def, personKey, possessive) {
    const wrap = document.createElement("div");
    wrap.className = "field on";
    wrap.dataset.field = def.id;
    let ctrl = "";
    if (def.id === "gender") {
      ctrl = '<div class="ctrl gender-ctrl">' +
             '<button type="button" class="pill big" data-val="남자">남자</button>' +
             '<button type="button" class="pill big" data-val="여자">여자</button></div>';
    } else if (def.id === "birth") {
      ctrl = '<div class="ctrl row">' +
             '<input type="text" class="line-input date-input" inputmode="numeric" placeholder="YYYY.MM.DD">' +
             '<div class="pill-group">' +
             '<button type="button" class="pill cal selected" data-cal="양력">양력</button>' +
             '<button type="button" class="pill cal" data-cal="음력">음력</button></div></div>';
    } else if (def.id === "time") {
      ctrl = '<div class="ctrl row"><div class="time-inputs">' +
             '<input type="text" class="line-input time-h" inputmode="numeric" maxlength="2" placeholder="00">' +
             '<span class="colon">:</span>' +
             '<input type="text" class="line-input time-m" inputmode="numeric" maxlength="2" placeholder="00">' +
             '</div><button type="button" class="pill unknown">시간모름</button></div>';
    } else if (def.id === "name") {
      ctrl = '<div class="ctrl row">' +
             '<input type="text" class="line-input name-input" placeholder="이름 입력" autocomplete="off">' +
             '<button type="button" class="pill confirm">확인</button></div>';
    }
    wrap.innerHTML = '<div class="q"><p class="q-cap">' + def.cap + '</p>' +
                     '<h2 class="q-title">' + def.title(possessive) + '</h2></div>' + ctrl;
    wireField(wrap, def, personKey);
    return wrap;
  }

  function wireField(wrap, def, personKey) {
    const S = store[personKey];
    if (def.id === "gender") {
      let advanced = false;
      wrap.querySelectorAll(".pill.big").forEach(b => {
        b.onclick = () => {
          wrap.querySelectorAll(".pill.big").forEach(x => x.classList.remove("selected"));
          b.classList.add("selected");
          S.gender = b.dataset.val;
          if (!advanced) { advanced = true; advance(); }
        };
      });
    } else if (def.id === "birth") {
      S.birthType = "양력";
      const input = wrap.querySelector(".date-input");
      const cals = wrap.querySelectorAll(".pill.cal");
      cals.forEach(c => c.onclick = () => {
        cals.forEach(x => x.classList.remove("selected"));
        c.classList.add("selected");
        S.birthType = c.dataset.cal;
      });
      let advanced = false;
      input.oninput = () => {
        let d = input.value.replace(/\D/g, "").slice(0, 8);
        let f = d;
        if (d.length > 6) f = d.slice(0,4) + "." + d.slice(4,6) + "." + d.slice(6);
        else if (d.length > 4) f = d.slice(0,4) + "." + d.slice(4);
        input.value = f;
        if (validDate(d)) { S.birthdate = d; if (!advanced) { advanced = true; setTimeout(advance, 380); } }
        else { S.birthdate = ""; }
      };
    } else if (def.id === "time") {
      const h = wrap.querySelector(".time-h"), m = wrap.querySelector(".time-m"), unk = wrap.querySelector(".pill.unknown");
      let advanced = false;
      function chk() {
        const hv = parseInt(h.value, 10), mv = parseInt(m.value, 10);
        if (h.value !== "" && m.value !== "" && hv >= 0 && hv <= 23 && mv >= 0 && mv <= 59) {
          S.birthTime = String(hv).padStart(2,"0") + ":" + String(mv).padStart(2,"0");
          unk.classList.remove("selected");
          if (!advanced) { advanced = true; setTimeout(advance, 420); }
        }
      }
      h.oninput = () => {
        h.value = h.value.replace(/\D/g,"").slice(0,2);
        if (h.value.length === 2) m.focus();   // 시 두 자리 입력 시 분 칸으로 자동 이동
        chk();
      };
      m.oninput = () => { m.value = m.value.replace(/\D/g,"").slice(0,2); chk(); };
      unk.onclick = () => {
        S.birthTime = ""; unk.classList.add("selected"); h.value = ""; m.value = "";
        if (!advanced) { advanced = true; advance(); }
      };
    } else if (def.id === "name") {
      const input = wrap.querySelector(".name-input"), btn = wrap.querySelector(".pill.confirm");
      let advanced = false;
      function done() {
        const v = input.value.trim();
        if (!v) { shake(input); return; }
        S.name = v;
        if (!advanced) { advanced = true; advance(); }
      }
      btn.onclick = done;
      input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); done(); } });
    }
  }

  function renderField() {
    const def = FIELDS[fIdx];
    const node = buildField(def, PERSONS[pIdx].key, PERSONS[pIdx].possessive);
    stackList.appendChild(node);
    const inp = node.querySelector("input");
    if (inp) setTimeout(() => inp.focus(), 130);
    setProgress();
  }

  function advance() {
    const cur = stackList.querySelector(".field.on");
    if (cur) cur.classList.remove("on");
    fIdx++;
    if (fIdx < FIELDS.length) {
      renderField();
    } else {
      pIdx++;
      if (pIdx < PERSONS.length) {
        // 다음 사람 → 새 화면으로 전환
        fIdx = 0;
        stackWrap.classList.add("fading");
        setTimeout(() => {
          stackList.innerHTML = "";
          stackWho.textContent = PERSONS[pIdx].who;
          stackWrap.scrollTop = 0;
          renderField();
          stackWrap.classList.remove("fading");
        }, 260);
      } else {
        finishStack();
      }
    }
    setProgress();
  }

  function finishStack() {
    const M = store.me, Y = store.you;
    const set = (id, v) => document.getElementById(id).value = (v == null ? "" : v);
    set("f_name", M.name);           set("f_gender", M.gender);
    set("f_birthdate", M.birthdate); set("f_birthType", M.birthType || "양력"); set("f_birthTime", M.birthTime);
    set("f_partnerName", Y.name);           set("f_partnerGender", Y.gender);
    set("f_partnerBirthdate", Y.birthdate); set("f_partnerBirthType", Y.birthType || "양력"); set("f_partnerBirthTime", Y.birthTime);

    stackWrap.classList.add("hidden");
    document.getElementById("questionLayer").style.display = "block";
    sIdx = 0;
    showStepPhase();
  }

  /* ================= 스텝형: 이별 관련 + 카드 ================= */
  const questionTitle = document.getElementById("questionTitle");
  const questionLayer = document.getElementById("questionLayer");
  const cardStep      = document.getElementById("cardStep");
  const nextBtn       = document.getElementById("nextBtn");
  const cardNextBtn   = document.getElementById("cardNextBtn");
  const stepSections  = document.querySelectorAll("#sajuForm .step");
  const stepQuestions = [
    "우리는 왜\n멀어졌던 걸까요?",
    "이별을 먼저 통보한\n사람은 누구인가요?",
    "이별한 시기를\n알려주세요",
    "카드 한 장을\n선택해주세요"
  ];
  let sIdx = 0;

  function showStepPhase() {
    const isCard = sIdx === 3;
    stepSections.forEach((s, i) => s.classList.toggle("shown", !isCard && i === sIdx));
    questionTitle.innerText = stepQuestions[sIdx];
    questionLayer.classList.toggle("choice-mode", sIdx === 0 || sIdx === 1);
    setProgress();

    if (isCard) {
      cardStep.classList.add("shown");
      nextBtn.style.display = "none";
      cardNextBtn.style.display = "block";
      questionLayer.classList.add("card-mode");
    } else {
      cardStep.classList.remove("shown");
      nextBtn.style.display = "block";
      cardNextBtn.style.display = "none";
      questionLayer.classList.remove("card-mode");
      const ai = stepSections[sIdx].querySelector("input");
      if (ai) setTimeout(() => ai.focus(), 100);
    }
  }

  nextBtn.onclick = () => {
    if (sIdx === 0 && !document.getElementById("breakupReasonInput").value) {
      shake(stepSections[0].querySelector(".input-area")); return;
    }
    if (sIdx === 1 && !document.getElementById("breakupInitiatorInput").value) {
      shake(stepSections[1].querySelector(".input-area")); return;
    }
    if (sIdx === 2) {
      const v = document.querySelector("input[name='breakupDate']").value.trim();
      if (!/^\d{8}$/.test(v)) { shake(document.querySelector("input[name='breakupDate']")); return; }
    }
    sIdx++;
    showStepPhase();
  };

  function selectChoice(el, inputId) {
    const group = el.closest(".input-area");
    group.querySelectorAll(".choice-btn").forEach(b => b.classList.remove("sel"));
    el.classList.add("sel");
    document.getElementById(inputId).value = el.dataset.value;
  }

  function selectCard(el) {
    document.querySelectorAll(".card-item").forEach(c => c.classList.remove("selected"));
    el.classList.add("selected");
    document.getElementById("relationStatusInput").value = el.dataset.value;
  }

  function submitForm() {
    if (!document.getElementById("relationStatusInput").value) {
      shake(document.querySelector(".card-grid"));
      return;
    }
    document.getElementById("sajuForm").submit();
  }

  document.getElementById("cardStep").addEventListener("focus", function () { this.blur(); }, true);

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (!stackWrap.classList.contains("hidden")) return; // 누적형은 각 필드가 처리
    if (sIdx === 3) return;
    e.preventDefault();
    nextBtn.click();
  });

  // 시작
  renderField();
</script>

</body>
</html>
